<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta name="referrer" content="no-referrer">
  <title>คำขอเปลี่ยนรหัสผ่าน — CatMatch Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/password-reset.css">
</head>
<body>
  <div class="reset-sakura-scene" aria-hidden="true">
    <span class="reset-petal"></span><span class="reset-petal"></span><span class="reset-petal"></span>
    <span class="reset-petal"></span><span class="reset-petal"></span><span class="reset-petal"></span>

  </div>
  <header class="reset-header">
    <div class="reset-header-inner">
      <a class="reset-brand" href="./admin.html"><strong>CatMatch Admin</strong><small>จัดการคำขอเปลี่ยนรหัสผ่าน</small></a>

  <script src="../js/admin-password-resets.js"></script>
