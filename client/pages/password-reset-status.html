<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>สถานะคำขอเปลี่ยนรหัสผ่าน — CatMatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/password-reset.css">
</head>
<body>
  <div class="reset-sakura-scene" aria-hidden="true">
    <span class="reset-petal"></span><span class="reset-petal"></span><span class="reset-petal"></span>
    <span class="reset-petal"></span><span class="reset-petal"></span><span class="reset-petal"></span>
    <span class="reset-petal"></span><span class="reset-petal"></span><span class="reset-petal"></span>
    <span class="reset-petal"></span><span class="reset-petal"></span><span class="reset-petal"></span>
  </div>
  <header class="reset-header">
    <div class="reset-header-inner">
      <a class="reset-brand" href="./index.html"><strong>CatMatch</strong><small>แมวที่ใช่ สำหรับคุณ</small></a>
      <a class="reset-header-link" href="./forgot-password.html">ส่งคำขอใหม่</a>
    </div>
  </header>

  <main class="reset-main">
    <section class="reset-card" style="max-width:760px;margin:auto">
      <div class="reset-status-box">
        <span class="reset-status-badge" id="statusBadge">กำลังตรวจสอบ</span>
        <h2 id="statusTitle">ตรวจสอบสถานะคำขอ</h2>
        <p id="statusMessage">กรุณารอสักครู่</p>
      </div>

      <form class="reset-form" id="statusForm">
        <div class="reset-field">
          <label for="statusRequestCode">หมายเลขคำขอ</label>
          <input id="statusRequestCode" type="text" autocomplete="off" placeholder="หมายเลขคำขอจากขั้นตอนก่อนหน้า">
          <small class="reset-error" id="statusError"></small>
        </div>
        <button class="reset-button" id="statusSubmit" type="submit">ตรวจสอบอีกครั้ง</button>
      </form>
    </section>
  </main>
  <script src="../js/password-reset-status.js"></script>
</body>
</html>
