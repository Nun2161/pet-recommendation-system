  <script id="dog-auth-context-bootstrap">
  (() => {
    const q = new URLSearchParams(location.search);
    let remembered = false;
    try { remembered = sessionStorage.getItem("catmatch_auth_species") === "dog"; } catch {}
    const fromDog = /(?:dog-[^/?#]+\.html|[?&]species=dog)/i.test(document.referrer || "");
    if (q.get("species") === "dog" || remembered || fromDog) {
      document.documentElement.dataset.authSpecies = "dog";
    }
  })();
  </script>
