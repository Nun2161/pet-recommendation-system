<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>ตั้งรหัสผ่านใหม่ — CatMatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/password-reset.css">
</head>
<body>
  <div class="reset-sakura-scene" aria-hidden="true">
    <span class="reset-petal"></span><span class="reset-petal"></span><span class="reset-petal"></span>
    <span class="reset-petal"></span><span class="reset-petal"></span><span class="reset-petal"></span>
    <span class="reset-petal"></span><span class="reset-petal"></span><span class="reset-petal"></span>
    <span class="reset-petal"></span><span class="reset-petal"></span><span class="reset-petal"></span>
  </div>
  <header class="reset-header">
    <div class="reset-header-inner">
      <a class="reset-brand" href="./index.html"><strong>CatMatch</strong><small>แมวที่ใช่ สำหรับคุณ</small></a>
      <a class="reset-header-link" href="./login.html">กลับหน้าเข้าสู่ระบบ</a>
    </div>
  </header>

  <main class="reset-main">
    <section class="reset-card" style="max-width:700px;margin:auto">
      <h2>ตั้งรหัสผ่านใหม่</h2>
      <p>Reset Token ใช้ได้ครั้งเดียวและหมดอายุภายใน 15 นาที</p>

      <form class="reset-form" id="resetPasswordForm" novalidate>
        <div class="reset-field">
          <label for="newPassword">รหัสผ่านใหม่ <span>*</span></label>
          <div class="reset-password-shell">
            <input id="newPassword" type="password" minlength="10" maxlength="10" autocomplete="new-password" placeholder="รหัสผ่านใหม่ 10 ตัว" required>
            <button class="reset-password-toggle" type="button" data-target="newPassword" aria-label="แสดงรหัสผ่าน">แสดง</button>
          </div>
        </div>

        <div class="reset-field">
          <label for="confirmNewPassword">ยืนยันรหัสผ่านใหม่ <span>*</span></label>
          <div class="reset-password-shell">
            <input id="confirmNewPassword" type="password" minlength="10" maxlength="10" autocomplete="new-password" placeholder="กรอกรหัสผ่านใหม่อีกครั้ง" required>
            <button class="reset-password-toggle" type="button" data-target="confirmNewPassword" aria-label="แสดงรหัสผ่าน">แสดง</button>
          </div>
        </div>

        <div class="password-rules" id="passwordRules">
          <span class="password-rule" data-rule="length">10 ตัวพอดี</span>
          <span class="password-rule" data-rule="case">ตัวพิมพ์เล็กและใหญ่</span>
          <span class="password-rule" data-rule="number">มีตัวเลข</span>
          <span class="password-rule" data-rule="special">มีสัญลักษณ์</span>
        </div>

        <small class="reset-error" id="resetPasswordError"></small>
        <div class="reset-message" id="resetPasswordMessage" hidden></div>
        <button class="reset-button" id="resetPasswordSubmit" type="submit">บันทึกรหัสผ่านใหม่</button>
      </form>
    </section>
  </main>
  <script src="../js/reset-password.js"></script>
</body>
</html>
